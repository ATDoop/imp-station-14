- type: entity
  id: AnomalyMummy #dont put this in spawners! not parented to the base anomaly so i can mess with the sound and animation stuff
  name: anomummy
  description: Revenge.
  suffix: Mummy
  components:
  - type: Anomaly
    corePrototype: AnomalyCoreFlesh #MUMMY TODO
    coreInertPrototype: AnomalyCoreFleshInert
    minPulseLength: 5 #the anomaly spawning is a fail state for the crew, fighting it should be extremely difficult
    maxPulseLength: 10
    growthThreshold: 0.01
   # pulseSound:  #MUMMY TODO
    supercriticalSoundAtAnimationStart:
      collection: AnomalyFleshSupercritical #MUMMY TODO
  - type: AmbientSound
    range: 5
    volume: -5
    sound:
      path: /Audio/_Impstation/Effects/Mummies/sandstorm_loop.ogg
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _Impstation/Structures/Specific/Anomalies/mummyanomaly.rsi
    layers:
    - state: sarconomaly_darkness #the sinister pinecone
    - state: sarconomaly_lines
      shader: unshaded
    - state: sarconomaly
      map: ["enum.AnomalyVisualLayers.Base"]
    - state: sarconomaly_pulse #MUMMY TODO ? i dont know why this is a todo
      map: ["enum.AnomalyVisualLayers.Animated"]
      visible: false
    - state: sarconomaly_face
      shader: unshaded
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
  - type: Appearance
  - type: AnimationPlayer
  - type: GuideHelp
    guides:
    - AnomalousResearch #MUMMY TODO: mummy guidebook (probably too late to read it at this point though)
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/teleport_arrival.ogg #MUMMY TODO
  - type: SecretDataAnomaly
    randomStartSecretMin: 0
    randomStartSecretMax: 2
  - type: DamageOnInteract
    damage:
      types:
        Slash: 10
    popupText: mummy-anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Slash: 10
  - type: WarpPoint
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Tag
    tags:
    - GhostOnlyWarp
  - type: NameIdentifier
    group: Anomaly
  - type: PointLight
    radius: 1.0
    energy: 3.5
    color: "#e92138"
    castShadows: false
  - type: TileSpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: true
        spawnOnStabilityChanged: true
        minAmount: 25
        maxAmount: 45
        maxRange: 5
      floor: FloorMummyDesert
    - settings:
        spawnOnSuperCritical: true
        minAmount: 60
        maxAmount: 150 # MUMMY TODO: check and see if this is a reasonable amount. it should be A LOT of tiles.
        maxRange: 12
      floor: FloorMummyDesert
  - type: EntitySpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: true
        minAmount: 1
        maxAmount: 2
        minRange: 1.5
        maxRange: 5
      spawns:
      - MummyBlocker
    - settings:
        spawnOnPulse: true
        minAmount: 0
        maxAmount: 1
        minRange: 1.5
        maxRange: 5
      spawns:
      - MummyBlockerRare
    - settings:
        spawnOnPulse: true
        maxAmount: 1
        minRange: 3
        maxRange: 5
      spawns:
      - MobCanopicJarWarrior #MUMMY TODO: more mobs
    - settings:
        spawnOnSuperCritical: true
        minAmount: 10
        maxAmount: 15
        minRange: 5
        maxRange: 15
      spawns:
      - MummyBlocker
    - settings:
        spawnOnPulse: true
        minAmount: 0
        maxAmount: 2
        minRange: 5
        maxRange: 15
      spawns:
      - MummyBlockerRare
    - settings:
        spawnOnSuperCritical: true
        minAmount: 4
        maxAmount: 8
        maxRange: 15
      spawns:
      - MobCanopicJarWarrior #MUMMY TODO: more mobs
    - settings:
        spawnOnShutdown: true
        maxAmount: 2
        maxRange: 1
      spawns:
      - MobCanopicJarWarrior #MUMMY TODO: more mobs
  - type: WallSpawnAnomaly #imp
    entries:
    - settings:
        spawnOnPulse: true
        spawnOnStabilityChanged: true
        spawnOnSeverityChanged: true
        minAmount: 3
        maxAmount: 7
        maxRange: 5
      wall: WallMeat #MUMMY TODO
    - settings:
        spawnOnSuperCritical: true
        minAmount: 10
        maxAmount: 30
        maxRange: 15
      wall: WallMeat #MUMMY TODO
