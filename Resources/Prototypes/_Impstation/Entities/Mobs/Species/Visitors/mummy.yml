- type: entity
  parent: BaseMobSpecies #theyre not organic MUMMY TODO: make sure this didnt fuck anything up
  id: BaseMobMummy
  name: Urist McMummy
  abstract: true
  components:
  #they dont get hungry or thirsy, so those components aren't here
  - type: Icon
    sprite: _Impstation/Mobs/Species/Visitors/Mummy/parts.rsi
    state: full
  - type: Body #MUMMY TODO organs
    prototype: Mummy
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Mummy
  - type: Destructible #MUMMY TODO: figure out their health
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:GibBehavior { }
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    attackRate: 1
    damage:
      types:
        Slash: 10
  - type: NpcFactionMember
    factions:
    - Mummy
  - type: TypingIndicator
    proto: mummy
  - type: Speech
    speechVerb: Mummy
    speechSounds: Mummy 
    allowedEmotes: ['Meow', 'Hiss']
    suffixSpeechVerbs:
      chat-speech-verb-suffix-exclamation-strong: MummyExclamationStrong
      chat-speech-verb-suffix-exclamation: MummyExclamation
      chat-speech-verb-suffix-stutter: MummyStutter
  - type: Vocal
    sounds:
      Male: UnisexMummy
      Female: UnisexMummy
      Unsexed: UnisexMummy
  - type: HumanoidAppearance
    species: Mummy
    hideLayersOnEquip:
    - HeadTop
  - type: Inventory
    speciesId: mummy
    templateId: mummy
  - type: Access
    tags:
    - Wizard #for sarocpogus
  - type: Tag #mummy tag for imprinting mobs, no anomaly host tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - Mummy

- type: entity
  parent: BaseSpeciesDummy
  id: MobMummyDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: Mummy
    hideLayersOnEquip:
    - HeadTop
  - type: Inventory
    speciesId: mummy
    templateId: mummy
