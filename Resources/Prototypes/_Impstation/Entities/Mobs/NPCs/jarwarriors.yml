- type: entity
  name: canopic warrior #mummy todo: these should be ghost roles
  parent: [ MobCombat, SimpleSpaceMobBase ]
  id: MobCanopicJarWarrior
  description: An angry little canopic jar with arms and legs made from dust. It's weapons look like they're about to fall apart at any second...
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: jarwarrior
      sprite: _Impstation/Mobs/MummyMobs/jarwarriors.rsi
  - type: NpcFactionMember
    factions:
      - Mummy
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 175
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: PotBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ClothingHeadCanopicJarHelmet:
            min: 0
            max: 1
          CanopicJarShard:
            min: 1
            max: 3
          CanopicJarDust:
            min: 1
            max: 1
  - type: MeleeWeapon
    altDisarm: false
    angle: 45
    animation: WeaponArcDisarm #this is actually a slashing animation. WeaponArcSlash does not use its own sprite, and disarms dont use this weapon arc. what??
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.5 #they're not good at pursuing, they should be defending
  - type: ReplacementAccent
    accent: lessermummy
  - type: Speech
    speechSounds: Mummy
    speechVerb: Mummy
  - type: Vocal
    sounds:
      Male: UnisexMummy
      Female: UnisexMummy
      Unsexed: UnisexMummy
    wilhelmProbability: 0.001
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      collection: PotBreak
      params:
        variation: 0.125
  - type: NoSlip
  - type: ZombieImmune
  - type: NPCRetaliation
  - type: AlwaysRevolutionaryConvertible #yeah sure whatever
